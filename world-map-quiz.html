<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#071726">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dünya Haritası Quiz</title>
<style>
  :root{
    --ocean-top:#08243c;
    --ocean-bot:#04121f;
    --land:#2e4e68;
    --ink:#eaf3fa;
    --ink-dim:#9fb6c9;
    --accent:#57d1ff;
    --ok:#3ddc97;
    --bad:#ff6b6b;
    --panel:rgba(9,26,43,.72);
    --panel-line:rgba(126,178,214,.18);
    --shadow:0 10px 40px rgba(0,0,0,.45);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    background:#04121f;
    color:var(--ink);
    font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-user-select:none;user-select:none;
    -webkit-font-smoothing:antialiased;
    position:fixed;inset:0;width:100%;
  }

  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  /* ---------- top overlay: the country to find ---------- */
  #top{
    position:fixed;left:0;right:0;top:0;z-index:20;
    padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 12px) 12px calc(env(safe-area-inset-left,0px) + 12px);
    background:linear-gradient(180deg,rgba(4,18,31,.94) 0%,rgba(4,18,31,.82) 62%,rgba(4,18,31,0) 100%);
    pointer-events:none;
  }
  #topInner{
    max-width:760px;margin:0 auto;
    display:flex;align-items:center;gap:12px;
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:18px;
    padding:11px 14px;
    box-shadow:var(--shadow);
    -webkit-backdrop-filter:blur(14px) saturate(1.25);
    backdrop-filter:blur(14px) saturate(1.25);
    pointer-events:auto;
  }
  #prompt{flex:1;min-width:0}
  #label{
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--accent);font-weight:700;margin-bottom:2px;
  }
  /* Long names ("Federated States of Micronesia", "Demokratik Kongo
     Cumhuriyeti") must not get cut off - the prompt is the whole game. The
     name wraps to at most two lines and fitName() shrinks the type until it
     fits, so nothing is ever truncated. */
  #country{
    font-size:30px;font-weight:800;line-height:1.14;
    letter-spacing:-.01em;
    max-height:2.28em;overflow:hidden;
    overflow-wrap:break-word;word-break:normal;hyphens:auto;
  }
  #hintLine{font-size:12px;color:var(--ink-dim);margin-top:3px;height:15px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  #stats{display:flex;gap:8px;flex-shrink:0}
  .stat{
    text-align:center;min-width:46px;
    background:rgba(255,255,255,.05);
    border:1px solid var(--panel-line);
    border-radius:12px;padding:5px 7px;
  }
  .stat b{display:block;font-size:16px;font-weight:800;line-height:1.1}
  .stat span{display:block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);margin-top:1px}
  .stat.ok b{color:var(--ok)}
  .stat.bad b{color:var(--bad)}

  #bar{height:3px;border-radius:99px;background:rgba(255,255,255,.08);
    max-width:760px;margin:8px auto 0;overflow:hidden;pointer-events:none}
  #barFill{height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--accent),var(--ok));
    transition:width .35s cubic-bezier(.4,0,.2,1)}

  /* ---------- bottom controls ---------- */
  #bottom{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:14px calc(env(safe-area-inset-right,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 12px) calc(env(safe-area-inset-left,0px) + 12px);
    background:linear-gradient(0deg,rgba(4,18,31,.92) 0%,rgba(4,18,31,.7) 55%,rgba(4,18,31,0) 100%);
    display:flex;justify-content:center;pointer-events:none;
  }
  #bottomInner{
    display:flex;align-items:center;gap:10px;width:100%;max-width:460px;pointer-events:auto;
  }
  button{
    font-family:inherit;color:var(--ink);cursor:pointer;
    border:1px solid var(--panel-line);
    background:var(--panel);
    -webkit-backdrop-filter:blur(14px) saturate(1.25);
    backdrop-filter:blur(14px) saturate(1.25);
    border-radius:16px;
    box-shadow:var(--shadow);
    transition:transform .12s ease,background .18s ease,opacity .18s ease;
    touch-action:manipulation;
  }
  button:active{transform:scale(.95)}
  button:disabled{opacity:.4;cursor:default}
  .icon-btn{
    width:50px;height:50px;flex-shrink:0;
    font-size:21px;font-weight:700;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  #skip{
    flex:1;height:50px;font-size:16px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:8px;
    background:linear-gradient(180deg,rgba(87,209,255,.16),rgba(87,209,255,.07));
    border-color:rgba(87,209,255,.34);
  }
  #skip:active{background:rgba(87,209,255,.24)}

  /* ---------- floating toast ---------- */
  #toast{
    position:fixed;left:50%;top:50%;z-index:30;
    transform:translate(-50%,-50%) scale(.9);
    padding:13px 22px;border-radius:16px;
    font-size:17px;font-weight:800;letter-spacing:.01em;
    background:var(--panel);border:1px solid var(--panel-line);
    -webkit-backdrop-filter:blur(16px) saturate(1.3);
    backdrop-filter:blur(16px) saturate(1.3);
    box-shadow:var(--shadow);
    opacity:0;pointer-events:none;
    transition:opacity .2s ease,transform .28s cubic-bezier(.34,1.56,.64,1);
    text-align:center;max-width:86vw;
  }
  #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #toast.ok{color:var(--ok);border-color:rgba(61,220,151,.4)}
  #toast.bad{color:var(--bad);border-color:rgba(255,107,107,.4)}
  #toast.info{color:var(--accent);border-color:rgba(87,209,255,.4)}

  /* ---------- corner buttons ---------- */
  #corner{
    position:fixed;z-index:20;
    right:calc(env(safe-area-inset-right,0px) + 12px);
    top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:8px;
  }
  #corner .icon-btn{width:44px;height:44px;font-size:19px}

  /* ---------- end screen ---------- */
  #end{
    position:fixed;inset:0;z-index:40;
    display:none;align-items:center;justify-content:center;
    padding:24px;background:rgba(4,18,31,.86);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  }
  #end.show{display:flex}
  #endCard{
    width:100%;max-width:380px;text-align:center;
    background:var(--panel);border:1px solid var(--panel-line);
    border-radius:24px;padding:28px 22px;box-shadow:var(--shadow);
  }
  #endCard h2{margin:0 0 6px;font-size:25px;font-weight:800}
  #endCard p{margin:0 0 20px;color:var(--ink-dim);font-size:14px;line-height:1.5}
  #endStats{display:flex;gap:10px;margin-bottom:20px}
  #endStats div{flex:1;background:rgba(255,255,255,.05);border-radius:14px;padding:12px 6px}
  #endStats b{display:block;font-size:24px;font-weight:800}
  #endStats span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
  #again{width:100%;height:50px;font-size:16px;font-weight:700;
    background:linear-gradient(180deg,rgba(87,209,255,.2),rgba(87,209,255,.08));
    border-color:rgba(87,209,255,.36)}

  /* ---------- fatal error / no-script notice ---------- */
  #fatal,.fatal{
    position:fixed;left:12px;right:12px;top:50%;transform:translateY(-50%);
    z-index:100;max-height:72vh;overflow:auto;
    background:#2b1016;border:1px solid #ff6b6b;color:#ffdcdc;
    border-radius:16px;padding:16px 18px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;
  }
  #fatal[hidden]{display:none}

  /* Give the prompt more room on phones: the three counters were eating the
     width the country name needed. */
  @media (max-width:460px){
    #stats{gap:6px}
    .stat{min-width:38px;padding:4px 5px}
    .stat b{font-size:15px}
    .stat span{font-size:8px;letter-spacing:.05em}
  }
  @media (max-width:380px){
    #corner{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important}
  }
</style>
</head>
<body>

<div id="stage"><canvas id="map"></canvas></div>

<div id="top">
  <div id="topInner">
    <div id="prompt">
      <div id="label">Bul</div>
      <div id="country">Yükleniyor…</div>
      <div id="hintLine"></div>
    </div>
    <div id="stats">
      <div class="stat ok"><b id="sOk">0</b><span>Doğru</span></div>
      <div class="stat bad"><b id="sBad">0</b><span>Kaçan</span></div>
      <div class="stat"><b id="sLeft">0</b><span>Kalan</span></div>
    </div>
  </div>
  <div id="bar"><div id="barFill"></div></div>
</div>

<div id="corner">
  <button class="icon-btn" id="zin"  aria-label="Yakınlaştır">+</button>
  <button class="icon-btn" id="zout" aria-label="Uzaklaştır">−</button>
  <button class="icon-btn" id="home" aria-label="Tüm dünyayı göster">⌂</button>
</div>

<div id="bottom">
  <div id="bottomInner">
    <button class="icon-btn" id="lang" aria-label="Dili değiştir">TR</button>
    <button id="skip">Geç <span style="opacity:.6">›</span></button>
    <button class="icon-btn" id="restart" aria-label="Yeniden başlat">↻</button>
  </div>
</div>

<div id="toast"></div>

<noscript><div class="fatal">Bu oyun JavaScript gerektiriyor.
Dosyayı Safari veya Chrome'da açın; iOS'ta "Dosyalar" uygulamasının önizlemesi
JavaScript çalıştırmaz.</div></noscript>
<div id="fatal" hidden></div>

<script>
/* Runs before anything else. Two jobs:
   1. change the placeholder text, which proves scripts execute at all here
      (on iOS a file opened in Files/Quick Look renders the HTML but never
      runs JS, and the page just sits on the placeholder)
   2. surface any startup error on screen, since a phone has no console */
(function () {
  var box = document.getElementById('fatal');
  window.__fatal = function (msg) {
    if (!box) return;
    box.hidden = false;
    box.textContent = 'Başlatılamadı:\n\n' + msg;
  };
  window.onerror = function (msg, src, line, col, err) {
    window.__fatal(msg + '\n\n' + (src || '?') + ' : ' + line + ':' + col +
                   (err && err.stack ? '\n\n' + err.stack : ''));
    return false;
  };
  var c = document.getElementById('country');
  if (c) c.textContent = 'Harita hazırlanıyor…';
})();
</script>

<div id="end">
  <div id="endCard">
    <h2 id="endTitle">Tamamlandı</h2>
    <p id="endMsg"></p>
    <div id="endStats">
      <div><b id="eOk">0</b><span>Doğru</span></div>
      <div><b id="eBad">0</b><span>Kaçan</span></div>
      <div><b id="ePct">0%</b><span>Başarı</span></div>
    </div>
    <button id="again">Yeniden Oyna</button>
  </div>
</div>

    out[i * 2] = mercX(x / Q);
    out[i * 2 + 1] = mercY(y / Q);
  }
  return out;
}

function ringsToPath(rings, path) {
  for (var r = 0; r < rings.length; r++) {
    var p = rings[r];
    path.moveTo(p[0], p[1]);
    for (var i = 2; i < p.length; i += 2) path.lineTo(p[i], p[i + 1]);
    path.closePath();
  }
}

// deterministic per-country tint so neighbours read apart
function hashOf(s) {
  var h = 2166136261;
  for (var i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = (h * 16777619) >>> 0;
  }
  return h;
}

var LAND_BASE = [46, 78, 104];      // rgb of the default land fill
function tintFor(id) {
  var h = hashOf(id);
  var dl = ((h & 31) - 15) * 0.9;             // lightness jitter
  var dh = (((h >> 5) & 15) - 7) * 0.7;       // slight hue drift
  var r = Math.round(LAND_BASE[0] + dl + dh);
  var g = Math.round(LAND_BASE[1] + dl);
  var b = Math.round(LAND_BASE[2] + dl - dh);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

var countries = [];
var decorPath = new Path2D();

(function build() {
  for (var i = 0; i < RAW.c.length; i++) {
    var c = RAW.c[i];
    var parts = [];
    var path = new Path2D();
    var fx0 = Infinity, fy0 = Infinity, fx1 = -Infinity, fy1 = -Infinity;
    for (var p = 0; p < c.g.length; p++) {
      var rings = [];
      for (var r = 0; r < c.g[p].length; r++) {
        var ring = decodeRing(c.g[p][r]);
        rings.push(ring);
        for (var t = 0; t < ring.length; t += 2) {
          if (ring[t] < fx0) fx0 = ring[t];
          if (ring[t] > fx1) fx1 = ring[t];
          if (ring[t + 1] < fy0) fy0 = ring[t + 1];
          if (ring[t + 1] > fy1) fy1 = ring[t + 1];
        }
      }
      parts.push(rings);
      ringsToPath(rings, path);
    }
    // b = bounds of the main landmass, used for zooming and the dot test
    var bx0 = mercX(c.b[0] / Q), bx1 = mercX(c.b[2] / Q);
    var by0 = mercY(c.b[3] / Q), by1 = mercY(c.b[1] / Q);   // lat flips in y
    countries.push({
      id: c.i, tr: c.tr, en: c.en, cont: c.ct,
      parts: parts, path: path, tint: tintFor(c.i),
      bbox: [bx0, by0, bx1, by1],
      // full = every part, so culling never drops far-flung territory
      // (French Guiana, Alaska, Kaliningrad) when zoomed in on it
      full: [fx0, fy0, fx1, fy1],
      pt: [mercX(c.p[0] / Q), mercY(c.p[1] / Q)],
      w: bx1 - bx0, h: by1 - by0
    });
  }
  for (var d = 0; d < RAW.d.length; d++) {
    var rr = [];
    for (var k = 0; k < RAW.d[d].length; k++) rr.push(decodeRing(RAW.d[d][k]));
    ringsToPath(rr, decorPath);
  }
})();

if (!countries.length) {
  throw new Error('map data decoded to 0 countries (embedded JSON looks wrong)');
}

var byId = {};
countries.forEach(function (c) { byId[c.id] = c; });


/* ============================================================
   2. Canvas + camera
   Camera is {x, y} world centre plus {s} pixels-per-world-unit.
   ============================================================ */

var canvas = document.getElementById('map');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, dpr = 1;
// Most land sits north of the equator, so the resting view is centred a little
// above it (0.5 would leave a wide empty band along the bottom of the screen).
var HOME_Y = 0.44;
var cam = { x: 0.5, y: HOME_Y, s: 1000 };
var minS = 100, maxS = 260000;
var dirty = true;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  var r = canvas.getBoundingClientRect();
  W = Math.max(1, Math.round(r.width));
  H = Math.max(1, Math.round(r.height));
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Fit the whole world: full width, and the interesting latitude band
  // (about 78N..60S) inside the available height.
  var bandTop = mercY(78), bandBot = mercY(-60);
  minS = Math.min(W / 1.0, H / (bandBot - bandTop));
  maxS = minS * 900;
  if (cam.s < minS) cam.s = minS;
  clampCam();
  dirty = true;

  var nameEl = document.getElementById('country');
  if (nameEl && nameEl.textContent) fitName(nameEl);   // rotation changes the fit
}

function clampCam() {
  cam.s = Math.max(minS, Math.min(maxS, cam.s));
  // Keep only the camera centre over the map. Two earlier rules were worse:
  // pinning the map edges to the screen edges made it impossible to centre on
  // Hawaii or New Zealand, and snapping back to the middle whenever the world
  // was smaller than the viewport made dragging feel dead - on a 375x812 phone
  // at the default zoom that held on both axes, so panning did nothing at all
  // until you had zoomed past ~2.2x.
  cam.x = Math.max(0, Math.min(1, cam.x));
  cam.y = Math.max(0, Math.min(1, cam.y));
}

function toScreen(wx, wy) {
  return [(wx - cam.x) * cam.s + W / 2, (wy - cam.y) * cam.s + H / 2];
}
function toWorld(sx, sy) {
  return [(sx - W / 2) / cam.s + cam.x, (sy - H / 2) / cam.s + cam.y];
}

/* A country smaller than this on screen is drawn as a clickable dot instead of
   its own shape. Measured on a 375px phone showing the whole world: Belgium,
   Switzerland and Israel land at 4-5px (untappable, need a dot) while Greece
   and Portugal are ~7px and keep their outline. Raising this to 15px turned
   158 of 197 countries into dots and buried the map. */
var DOT_TRIGGER = 5;
function dotRadius() { return 4; }

function isDotted(c) {
  return Math.max(c.w, c.h) * cam.s < DOT_TRIGGER;
}


/* ============================================================
   3. Rendering
   ============================================================ */

var marks = {};        // id -> {color, line} for countries painted specially
var solved = {};       // id -> true, stays white for the rest of the run
var focusId = null;    // country pulsing as the revealed answer
var focusStart = 0;
var flashUntil = 0;    // keeps the loop redrawing while a country pulses green

var SOLVED_FILL = 'rgb(238,246,252)';
var SOLVED_LINE = 'rgba(255,255,255,0.9)';
var GREEN = [45, 190, 128];
var WHITE = [238, 246, 252];

function mixRGB(a, b, t) {
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ',' +
                  Math.round(a[1] + (b[1] - a[1]) * t) + ',' +
                  Math.round(a[2] + (b[2] - a[2]) * t) + ')';
}

/* colour a country should be filled with right now */
function fillFor(c, now) {
  var m = marks[c.id];
  if (m) {
    if (m.flash) {
      // two green pulses, brightening toward white, then it settles white
      var t = 0.5 + 0.5 * Math.cos((now - m.flash) / 105);
      return mixRGB(GREEN, WHITE, t * 0.75);
    }
    return m.color;
  }
  if (solved[c.id]) return SOLVED_FILL;
  return c.tint;
}
function lineFor(c) {
  var m = marks[c.id];
  if (m) return m.line;
  if (solved[c.id]) return SOLVED_LINE;
  return null;
}

function draw(now) {
  var g = ctx;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);

  // ocean
  var grad = g.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#08243c');
  grad.addColorStop(1, '#04121f');
  g.fillStyle = grad;
  g.fillRect(0, 0, W, H);

  // subtle graticule for depth
  drawGraticule(g);

  g.save();
  g.translate(W / 2, H / 2);
  g.scale(cam.s, cam.s);
  g.translate(-cam.x, -cam.y);

  var px = 1 / cam.s;                 // one CSS pixel in world units
  var view = viewBounds();

  // decorative territories (not part of the quiz)
  g.fillStyle = 'rgb(32,52,70)';
  g.fill(decorPath, 'evenodd');

  // land. Two passes so a neighbour's fill never paints over a border.
  var visible = [];
  for (var i = 0; i < countries.length; i++) {
    var c = countries[i];
    if (!intersects(c.full, view)) continue;
    visible.push(c);
    g.fillStyle = fillFor(c, now);
    g.fill(c.path, 'evenodd');
  }

  // Measured: stroking the visible countries one by one is several times
  // cheaper than stroking one combined Path2D holding every outline, and it
  // also gets the benefit of the culling above.
  g.lineJoin = 'bevel';
  g.lineCap = 'butt';
  g.strokeStyle = 'rgba(139,196,232,0.32)';
  g.lineWidth = 0.9 * px;
  for (var v = 0; v < visible.length; v++) g.stroke(visible[v].path);

  // brighter outline on solved / marked countries
  for (var s in solved) {
    if (marks[s]) continue;
    var sc = byId[s];
    if (!sc || !intersects(sc.full, view)) continue;
    g.strokeStyle = SOLVED_LINE;
    g.lineWidth = 1.4 * px;
    g.stroke(sc.path);
  }
  for (var k in marks) {
    var mk = marks[k], cc = byId[k];
    if (!cc) continue;
    g.strokeStyle = mk.line;
    g.lineWidth = 2.2 * px;
    g.stroke(cc.path);
  }

  g.restore();

  drawDots(g, now);
  drawFocus(g, now);
}

function viewBounds() {
  var a = toWorld(0, 0), b = toWorld(W, H);
  return [a[0], a[1], b[0], b[1]];
}
function intersects(bb, v) {
  return !(bb[2] < v[0] || bb[0] > v[2] || bb[3] < v[1] || bb[1] > v[3]);
}

function drawGraticule(g) {
  g.save();
  g.strokeStyle = 'rgba(120,180,220,0.055)';
  g.lineWidth = 1;
  g.beginPath();
  for (var lon = -180; lon <= 180; lon += 15) {
    var p = toScreen(mercX(lon), 0);
    if (p[0] < -2 || p[0] > W + 2) continue;
    g.moveTo(p[0], 0); g.lineTo(p[0], H);
  }
  for (var lat = -75; lat <= 75; lat += 15) {
    var q2 = toScreen(0, mercY(lat));
    if (q2[1] < -2 || q2[1] > H + 2) continue;
    g.moveTo(0, q2[1]); g.lineTo(W, q2[1]);
  }
  g.stroke();
  g.restore();
}

function drawDots(g, now) {
  var r = dotRadius();
  var view = viewBounds();
  g.save();
  for (var i = 0; i < countries.length; i++) {
    var c = countries[i];
    if (!isDotted(c)) continue;
    if (!intersects(c.bbox, view)) continue;
    var p = toScreen(c.pt[0], c.pt[1]);
    if (p[0] < -20 || p[0] > W + 20 || p[1] < -20 || p[1] > H + 20) continue;
    // Kept deliberately quiet: ~90 of these are on screen at world zoom, and
    // anything brighter turns the map into a bead necklace. The tap target is
    // much larger than the drawn dot (see hitTest).
    var marked = marks[c.id] || solved[c.id];
    g.beginPath();
    g.arc(p[0], p[1], marked ? r * 1.3 : r, 0, 6.2832);
    g.fillStyle = marked ? fillFor(c, now) : 'rgba(122,164,198,0.82)';
    g.fill();
    g.lineWidth = marked ? 1.5 : 1;
    g.strokeStyle = lineFor(c) || 'rgba(20,44,66,0.55)';
    g.stroke();
  }
  g.restore();
}

function drawFocus(g, now) {
  if (!focusId) return;
  var c = byId[focusId];
  if (!c) return;
  var p = toScreen(c.pt[0], c.pt[1]);
  var age = (now - focusStart) / 1000;
  var pulse = (age % 1.25) / 1.25;
  var baseR = Math.max(16, Math.min(Math.max(c.w, c.h) * cam.s * 0.6, 70));

  g.save();
  for (var i = 0; i < 2; i++) {
    var t = (pulse + i * 0.5) % 1;
    g.beginPath();
    g.arc(p[0], p[1], baseR * (0.5 + t * 1.15), 0, 6.2832);
    g.strokeStyle = 'rgba(255,190,110,' + (0.55 * (1 - t)).toFixed(3) + ')';
    g.lineWidth = 2.5;
    g.stroke();
  }
  g.restore();
}


/* ============================================================
   4. Hit testing (own point-in-polygon, so behaviour is
      identical on every browser)
   ============================================================ */

function pointInRings(wx, wy, rings) {
  var inside = false;
  for (var r = 0; r < rings.length; r++) {
    var p = rings[r], n = p.length >> 1;
    var j = n - 1;
    for (var i = 0; i < n; i++) {
      var xi = p[i * 2], yi = p[i * 2 + 1];
      var xj = p[j * 2], yj = p[j * 2 + 1];
      if ((yi > wy) !== (yj > wy)) {
        var xc = (xj - xi) * (wy - yi) / (yj - yi) + xi;
        if (wx < xc) inside = !inside;
      }
      j = i;
    }
  }
  return inside;
}

/* nearest dotted micro-state within `lim` screen pixels of the tap, or null */
function nearestDot(sx, sy, lim) {
  var best = null, bestD = lim * lim;
  for (var i = 0; i < countries.length; i++) {
    var c = countries[i];
    if (!isDotted(c)) continue;
    var p = toScreen(c.pt[0], c.pt[1]);
    var dx = p[0] - sx, dy = p[1] - sy;
    var d = dx * dx + dy * dy;
    if (d < bestD) { bestD = d; best = c; }
  }
  return best;
}

/* country whose actual shape contains this world point (dotted ones excluded:
   they are drawn as dots, not shapes) */
function shapeAt(wx, wy) {
  for (var k = 0; k < countries.length; k++) {
    var cc = countries[k];
    if (isDotted(cc)) continue;
    for (var pi = 0; pi < cc.parts.length; pi++) {
      if (pointInRings(wx, wy, cc.parts[pi])) return cc;
    }
  }
  return null;
}

/* `preferId` is the country currently being asked for.

   At world zoom a micro-state's dot physically overlaps its big neighbour -
   San Marino sits on Italy, Lesotho on South Africa, Switzerland next to the
   middle of France. Whichever one we hard-code to win, the other becomes
   untappable. So the tap is resolved in favour of the country the player was
   actually asked to find, and only falls back to a fixed order otherwise. */
function hitTest(sx, sy, preferId) {
  var w = toWorld(sx, sy);
  var shape = shapeAt(w[0], w[1]);
  var dotOn = nearestDot(sx, sy, 5);       // squarely on a dot
  var dotNear = nearestDot(sx, sy, 13);    // near a dot (finger-sized)

  if (preferId) {
    if (dotNear && dotNear.id === preferId) return dotNear;
    if (shape && shape.id === preferId) return shape;
  }
  // Real land beats a neighbouring dot: at world zoom the dots of Slovenia,
  // Togo or Jamaica sit within a few pixels of the middle of Austria, Benin
  // and Cuba, and letting them win renames the country the player tapped.
  if (shape) return shape;
  if (dotOn) return dotOn;

  // open sea: only a nearby dot counts, otherwise the tap does nothing -
  // better than guessing and scoring a wrong answer
  return dotNear;
}


/* ============================================================
   5. Camera animation
   ============================================================ */

var anim = null;
function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

function flyTo(x, y, s, ms) {
  glide = null;
  anim = { fx: cam.x, fy: cam.y, fs: cam.s, tx: x, ty: y, ts: s,
           t0: performance.now(), dur: ms || 600 };
}

function focusCountry(c, tight) {
  var pad = tight ? 0.55 : 0.42;
  var sw = W * pad / Math.max(c.w, 1e-6);
  var sh = H * pad / Math.max(c.h, 1e-6);
  var s = Math.min(sw, sh);
  s = Math.max(minS, Math.min(s, minS * 55));
  // never zoom out just to show a huge country
  if (s < cam.s && Math.max(c.w, c.h) * cam.s < Math.min(W, H) * 0.8) s = cam.s;
  flyTo(c.pt[0], c.pt[1], s, 700);
}

/* Flick-to-glide. Without it a drag stops dead the instant the finger lifts,
   which reads as heavy and unresponsive next to any native map. */
var glide = null;
var vel = { x: 0, y: 0, t: 0 };

function trackVelocity(dx, dy, now) {
  var dt = now - vel.t;
  vel.t = now;
  if (dt <= 0 || dt > 120) { vel.x = 0; vel.y = 0; return; }
  var k = 0.45;                       // smooth so one jittery sample can't fling
  vel.x = vel.x * (1 - k) + (dx / dt) * k;
  vel.y = vel.y * (1 - k) + (dy / dt) * k;
}

function startGlide(now) {
  if (now - vel.t > 90) return;       // finger paused before lifting: no throw
  if (Math.abs(vel.x) < 0.12 && Math.abs(vel.y) < 0.12) return;
  glide = { vx: vel.x, vy: vel.y, t: now };
}

function stepGlide(now) {
  if (!glide) return false;
  var dt = Math.min(now - glide.t, 40);
  glide.t = now;
  if (dt <= 0) return true;
  cam.x -= glide.vx * dt / cam.s;
  cam.y -= glide.vy * dt / cam.s;
  var decay = Math.pow(0.9965, dt);
  glide.vx *= decay;
  glide.vy *= decay;
  clampCam();
  if (Math.abs(glide.vx) < 0.02 && Math.abs(glide.vy) < 0.02) glide = null;
  return true;
}

function stepAnim(now) {
  if (!anim) return false;
  var t = (now - anim.t0) / anim.dur;
  if (t >= 1) {
    cam.x = anim.tx; cam.y = anim.ty; cam.s = anim.ts;
    anim = null; clampCam(); return true;
  }
  var e = easeInOut(t);
  cam.x = anim.fx + (anim.tx - anim.fx) * e;
  cam.y = anim.fy + (anim.ty - anim.fy) * e;
  cam.s = anim.fs * Math.pow(anim.ts / anim.fs, e);   // zoom feels linear in log space
  clampCam();
  return true;
}


/* ============================================================
   6. Input: drag, pinch, wheel, double-tap
   ============================================================ */

var pointers = new Map();
var dragged = false, downAt = 0, downPos = null;
var pinch = null;
var lastTap = 0;

canvas.addEventListener('pointerdown', function (e) {
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* not fatal */ }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    dragged = false; downAt = performance.now();
    downPos = { x: e.clientX, y: e.clientY };
    anim = null;
    glide = null;                       // touching down catches the map
    vel.x = 0; vel.y = 0; vel.t = downAt;
  } else if (pointers.size === 2) {
    var pts = [].concat(Array.from(pointers.values()));
    pinch = {
      d: dist(pts[0], pts[1]),
      s: cam.s,
      mid: mid(pts[0], pts[1]),
      w: toWorld.apply(null, screenXY(mid(pts[0], pts[1])))
    };
    dragged = true;
  }
});

function screenXY(p) {
  var r = canvas.getBoundingClientRect();
  return [p.x - r.left, p.y - r.top];
}
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function mid(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }

canvas.addEventListener('pointermove', function (e) {
  var prev = pointers.get(e.pointerId);
  if (!prev) return;
  var cur = { x: e.clientX, y: e.clientY };
  pointers.set(e.pointerId, cur);

  if (pointers.size === 2 && pinch) {
    var pts = Array.from(pointers.values());
    var nd = dist(pts[0], pts[1]);
    if (pinch.d > 0) {
      cam.s = Math.max(minS, Math.min(maxS, pinch.s * (nd / pinch.d)));
      var m = screenXY(mid(pts[0], pts[1]));
      // keep the world point that was under the pinch centre pinned there
      cam.x = pinch.w[0] - (m[0] - W / 2) / cam.s;
      cam.y = pinch.w[1] - (m[1] - H / 2) / cam.s;
      clampCam(); dirty = true;
    }
    return;
  }

  if (pointers.size === 1) {
    var dx = cur.x - prev.x, dy = cur.y - prev.y;
    if (!dragged && downPos) {
      var md = Math.hypot(cur.x - downPos.x, cur.y - downPos.y);
      if (md > 7) {
        dragged = true;
        // Move by everything since the finger went down. Using only this
        // step's delta would silently swallow the first 7px of every drag,
        // which reads as the map lagging behind the finger.
        dx = cur.x - downPos.x;
        dy = cur.y - downPos.y;
      }
    }
    if (dragged) {
      cam.x -= dx / cam.s;
      cam.y -= dy / cam.s;
      trackVelocity(dx, dy, performance.now());
      clampCam(); dirty = true;
    }
  }
});

function endPointer(e) {
  var had = pointers.has(e.pointerId);
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!had) return;

  if (pointers.size === 0 && dragged) startGlide(performance.now());

  if (pointers.size === 0 && !dragged && downPos) {
    var now = performance.now();
    var xy = screenXY(downPos);
    if (now - lastTap < 300) {
      lastTap = 0;
      zoomAt(xy[0], xy[1], 2.1);
    } else {
      lastTap = now;
      handleTap(xy[0], xy[1]);
    }
  }
  downPos = null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

canvas.addEventListener('wheel', function (e) {
  e.preventDefault();
  var r = canvas.getBoundingClientRect();
  var f = Math.pow(1.0016, -e.deltaY * (e.deltaMode === 1 ? 16 : 1));
  zoomAt(e.clientX - r.left, e.clientY - r.top, f);
}, { passive: false });

function zoomAt(sx, sy, factor) {
  var before = toWorld(sx, sy);
  cam.s = Math.max(minS, Math.min(maxS, cam.s * factor));
  var after = toWorld(sx, sy);
  cam.x += before[0] - after[0];
  cam.y += before[1] - after[1];
  clampCam(); dirty = true;
  anim = null; glide = null;
}

// iOS Safari still fires these on the page; keep the map from fighting them
['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
  document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
});
document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener('contextmenu', function (e) {
  if (e.target === canvas) e.preventDefault();
});


/* ============================================================
   7. Quiz
   ============================================================ */

var LANG = 'tr';
var STR = {
  tr: { find: 'Bul', ok: 'Doğru!', bad: 'Yanlış, bir hakkın kaldı',
        reveal: 'İşte burası', skipped: 'Atlandı', left: 'Kalan',
        done: 'Tamamlandı', hintTail: '', skip: 'Geç',
        endMsg: '197 ülkenin tamamı soruldu.',
        clicked: function (n) { return 'Bu ' + n; } },
  en: { find: 'Find', ok: 'Correct!', bad: 'Wrong, one try left',
        reveal: 'Here it is', skipped: 'Skipped', left: 'Left',
        done: 'Finished', hintTail: '', skip: 'Skip',
        endMsg: 'All 197 countries have been asked.',
        clicked: function (n) { return 'That is ' + n; } }
};

var queue = [], qi = 0, wrong = 0, nOk = 0, nBad = 0, locked = false;

function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function nameOf(c) { return LANG === 'tr' ? c.tr : c.en; }

function startGame() {
  queue = shuffle(countries.slice());
  qi = 0; wrong = 0; nOk = 0; nBad = 0; locked = false;
  marks = {}; solved = {}; focusId = null; flashUntil = 0; camBefore = null;
  clearTimeout(advTimer);
  document.getElementById('end').classList.remove('show');
  flyTo(0.5, HOME_Y, minS, 500);
  showQuestion();
  updateStats();
}

function current() { return queue[qi]; }

/* Shrink the prompt until the whole name fits its two-line box. Starts from the
   width-based ideal each time so short names stay big. */
var MAX_NAME_PX = 30, MIN_NAME_PX = 15;
function fitName(el) {
  var size = Math.max(MIN_NAME_PX, Math.min(MAX_NAME_PX, W * 0.062));
  el.style.fontSize = size + 'px';
  // scrollHeight exceeding clientHeight means a third line was clipped
  var guard = 0;
  while (size > MIN_NAME_PX && el.scrollHeight > el.clientHeight + 1 && guard++ < 40) {
    size -= 1;
    el.style.fontSize = size + 'px';
  }
}

function showQuestion() {
  var c = current();
  if (!c) return;
  document.getElementById('country').textContent = nameOf(c);
  fitName(document.getElementById('country'));
  document.getElementById('hintLine').textContent = '';
  document.getElementById('label').textContent = STR[LANG].find;
  dirty = true;
}

function updateStats() {
  document.getElementById('sOk').textContent = nOk;
  document.getElementById('sBad').textContent = nBad;
  document.getElementById('sLeft').textContent = Math.max(0, queue.length - qi);
  var pct = queue.length ? (qi / queue.length) * 100 : 0;
  document.getElementById('barFill').style.width = pct.toFixed(1) + '%';
}

var toastTimer = null;
function toast(msg, kind, ms) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + (kind || 'info');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.className = ''; }, ms || 1100);
}

function markCountry(id, kind) {
  var palette = {
    ok:     { color: 'rgb(45,190,128)', line: 'rgba(150,255,215,.95)',
              flash: performance.now() },
    bad:    { color: 'rgb(168,62,62)',  line: 'rgba(255,150,150,.9)' },
    reveal: { color: 'rgb(212,142,58)', line: 'rgba(255,205,130,1)' }
  };
  marks[id] = palette[kind];
  if (kind === 'ok') flashUntil = performance.now() + 900;
  dirty = true;
}

function handleTap(sx, sy) {
  if (locked) return;
  var target = current();
  if (!target) return;
  var c = hitTest(sx, sy, target.id);
  if (!c) return;

  if (c.id === target.id) {
    nOk++;
    solved[c.id] = true;          // stays white for the rest of the run
    markCountry(c.id, 'ok');
    toast(STR[LANG].ok, 'ok', 800);
    // deliberately no camera move here: the player already knows where it is,
    // and yanking the view would break their flow into the next question
    advance(950);
  } else {
    wrong++;
    markCountry(c.id, 'bad');
    var nm = nameOf(c);
    if (wrong >= 2) {
      revealAnswer();
    } else {
      toast(STR[LANG].clicked(nm), 'bad', 1200);
      document.getElementById('hintLine').textContent =
        STR[LANG].bad + ' · ' + target.cont;
      setTimeout(function () { delete marks[c.id]; dirty = true; }, 900);
    }
  }
  updateStats();
}

function revealAnswer() {
  var c = current();
  if (!c) return;
  locked = true;
  nBad++;
  marks = {};
  markCountry(c.id, 'reveal');
  focusId = c.id;
  focusStart = performance.now();
  // remember where the player was looking so we can put them back
  camBefore = { x: cam.x, y: cam.y, s: cam.s };
  focusCountry(c, true);
  toast(STR[LANG].reveal + ': ' + nameOf(c), 'info', 1700);
  document.getElementById('hintLine').textContent = c.cont;
  updateStats();
  advance(2100);
}

var advTimer = null, camBefore = null;
function advance(ms) {
  locked = true;
  clearTimeout(advTimer);
  advTimer = setTimeout(function () {
    marks = {}; focusId = null; wrong = 0; locked = false;
    if (camBefore) {                       // undo the reveal zoom
      flyTo(camBefore.x, camBefore.y, camBefore.s, 520);
      camBefore = null;
    }
    qi++;
    updateStats();
    if (qi >= queue.length) return finish();
    showQuestion();
    dirty = true;
  }, ms);
}

function finish() {
  var pct = queue.length ? Math.round((nOk / queue.length) * 100) : 0;
  document.getElementById('eOk').textContent = nOk;
  document.getElementById('eBad').textContent = nBad;
  document.getElementById('ePct').textContent = pct + '%';
  document.getElementById('endTitle').textContent = STR[LANG].done;
  document.getElementById('endMsg').textContent = STR[LANG].endMsg;
  document.getElementById('end').classList.add('show');
}


/* ============================================================
   8. UI wiring
   ============================================================ */

document.getElementById('skip').addEventListener('click', function () {
  if (locked) return;
  revealAnswer();
});
document.getElementById('restart').addEventListener('click', startGame);
document.getElementById('again').addEventListener('click', startGame);
document.getElementById('zin').addEventListener('click', function () {
  zoomAt(W / 2, H / 2, 1.7);
});
document.getElementById('zout').addEventListener('click', function () {
  zoomAt(W / 2, H / 2, 1 / 1.7);
});
document.getElementById('home').addEventListener('click', function () {
  flyTo(0.5, HOME_Y, minS, 550);
});
document.getElementById('lang').addEventListener('click', function () {
  LANG = LANG === 'tr' ? 'en' : 'tr';
  this.textContent = LANG.toUpperCase();
  document.documentElement.lang = LANG;
  document.getElementById('skip').firstChild.nodeValue = STR[LANG].skip + ' ';
  var st = document.querySelectorAll('.stat span');
  if (LANG === 'en') {
    st[0].textContent = 'Correct'; st[1].textContent = 'Missed'; st[2].textContent = 'Left';
  } else {
    st[0].textContent = 'Doğru'; st[1].textContent = 'Kaçan'; st[2].textContent = 'Kalan';
  }
  showQuestion();
});

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function () { setTimeout(resize, 220); });
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', resize);
}

function loop(now) {
  if (stepAnim(now)) dirty = true;
  if (stepGlide(now)) dirty = true;
  if (focusId) dirty = true;         // pulse keeps animating
  if (now < flashUntil) dirty = true;
  if (dirty) { draw(now); dirty = false; }
  requestAnimationFrame(loop);
}

resize();
startGame();
requestAnimationFrame(loop);

})();
</script>
